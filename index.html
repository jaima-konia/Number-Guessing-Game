<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess The number</title>
  </head>
  <body>
    <section>
      <h1>Welcome!🦋</h1>
      <p>Guess the number I have in my mind 😉</p>
      <label>Enter a number between 1 - 100</label><br />
      <input id="input" type="number" /> <br /><br />
      <button id="btn" onclick="calculate()">Submit</button>
      <button id="resetBtn" onclick="resetGame()">Play Again</button>
      <p id="score"></p>
    </section>

    <script src="index.js"></script>
  </body>
</html>
